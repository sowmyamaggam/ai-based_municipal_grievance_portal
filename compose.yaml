services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      MODEL_PATH: /models/municipal-image-model.keras
      WORK_TYPE_MODEL_PATH: /app/artifacts/work_type_model.joblib
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ml-service/image-models:/models:ro
    restart: unless-stopped
